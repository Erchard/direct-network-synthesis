[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "direct-network-synthesis"
version = "0.1.0"
description = "Reproducible research code for direct, non-iterative neural representation synthesis."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
circuits = [
    "yowasp-yosys==0.68.0.0.post1208",
    "z3-solver==5.1.0.0",
]
dev = [
    "psutil>=7.2.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
